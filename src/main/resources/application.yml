spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secureapi}
    username: ${DB_USER:secureapi}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: 30

server:
  error:
    include-message: never
    include-stacktrace: never
